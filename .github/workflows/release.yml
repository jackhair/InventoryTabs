name: Publish Artifacts

# On release, build every supported Minecraft version branch and attach all
# loader jars to the release, so one release carries every version/loader.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # One entry per supported Minecraft version branch. game_version is
        # passed to the publishing steps explicitly rather than letting them
        # infer it from the jar metadata, whose ranges (e.g. ~1.21.1) would
        # otherwise be expanded to every 1.21.x release.
        include:
          - branch: '26.2'
            game_version: '26.2'
          - branch: '1.21.1'
            game_version: '1.21.1'
          - branch: '1.20.1'
            game_version: '1.20.1'
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: attach jars to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob nullglob
          gh release upload ${{ github.event.release.tag_name }} \
            fabric/build/libs/!(*-sources).jar \
            neoforge/build/libs/!(*-sources).jar \
            forge/build/libs/!(*-sources).jar --clobber
      # The publishing steps below are skipped until CURSEFORGE_TOKEN /
      # MODRINTH_TOKEN secrets and CURSEFORGE_ID / MODRINTH_ID variables are
      # configured for this repository.
      - name: publish fabric jar to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(sources)).jar
          version-type: release
          name: Improved Inventory Tabs ${{ github.event.release.tag_name }} for Minecraft ${{ matrix.game_version }} (Fabric)
          game-versions: ${{ matrix.game_version }}
          dependencies: |
            cloth-config(required){curseforge:348521}{modrinth:9s6osm5g}
            fabric-api(required){curseforge:306612}{modrinth:P7dR8mSH}
            modmenu(optional){curseforge:308702}{modrinth:mOgUt4GM}
          loaders: |
            fabric
            quilt
      - name: publish neoforge jar to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' && hashFiles('neoforge/build/libs/*.jar') != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(sources)).jar
          version-type: release
          name: Improved Inventory Tabs ${{ github.event.release.tag_name }} for Minecraft ${{ matrix.game_version }} (NeoForge)
          game-versions: ${{ matrix.game_version }}
          dependencies: |
            cloth-config(required){curseforge:348521}{modrinth:9s6osm5g}
          loaders: |
            neoforge
      - name: publish forge jar to CurseForge
        if: ${{ env.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_ID != '' && hashFiles('forge/build/libs/*.jar') != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: forge/build/libs/!(*-@(sources)).jar
          version-type: release
          name: Improved Inventory Tabs ${{ github.event.release.tag_name }} for Minecraft ${{ matrix.game_version }} (Forge)
          game-versions: ${{ matrix.game_version }}
          dependencies: |
            cloth-config(required){curseforge:348521}{modrinth:9s6osm5g}
          loaders: |
            forge
      - name: publish fabric jar to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          files: fabric/build/libs/!(*-@(sources)).jar
          version-type: release
          name: Improved Inventory Tabs ${{ github.event.release.tag_name }} for Minecraft ${{ matrix.game_version }} (Fabric)
          game-versions: ${{ matrix.game_version }}
          dependencies: |
            cloth-config(required){curseforge:348521}{modrinth:9s6osm5g}
            fabric-api(required){curseforge:306612}{modrinth:P7dR8mSH}
            modmenu(optional){curseforge:308702}{modrinth:mOgUt4GM}
          loaders: |
            fabric
            quilt
      - name: publish neoforge jar to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && vars.MODRINTH_ID != '' && hashFiles('neoforge/build/libs/*.jar') != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          files: neoforge/build/libs/!(*-@(sources)).jar
          version-type: release
          name: Improved Inventory Tabs ${{ github.event.release.tag_name }} for Minecraft ${{ matrix.game_version }} (NeoForge)
          game-versions: ${{ matrix.game_version }}
          dependencies: |
            cloth-config(required){curseforge:348521}{modrinth:9s6osm5g}
          loaders: |
            neoforge
      - name: publish forge jar to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && vars.MODRINTH_ID != '' && hashFiles('forge/build/libs/*.jar') != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: intersection
          files: forge/build/libs/!(*-@(sources)).jar
          version-type: release
          name: Improved Inventory Tabs ${{ github.event.release.tag_name }} for Minecraft ${{ matrix.game_version }} (Forge)
          game-versions: ${{ matrix.game_version }}
          dependencies: |
            cloth-config(required){curseforge:348521}{modrinth:9s6osm5g}
          loaders: |
            forge
